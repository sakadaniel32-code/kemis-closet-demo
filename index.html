<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kemi's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e6e2dc;--wa:#1f8f4e;--warn:#b4561b;--soft:#efebe5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(246,244,241,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em}.nav a{margin-left:16px;color:var(--muted);font-weight:500}.nav a.on{color:var(--ink)}
main{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
.hero{padding:18px 0 22px}.hero h1{margin:0 0 6px;font-size:28px;letter-spacing:-.02em}.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}.chip{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:99px;color:var(--muted)}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:block}
.card .ph{aspect-ratio:3/4;background:var(--soft);position:relative}.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:12px 14px 14px}.card h3{margin:0 0 4px;font-size:15px;font-weight:600}.price{font-weight:600}
.badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:#fff}
.badge.out{background:var(--ink);color:#fff}.badge.low{background:#fff;color:var(--warn)}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:34px}@media(max-width:760px){.pd{grid-template-columns:1fr}}
.pd img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.pd h1{margin:4px 0 6px;font-size:26px;letter-spacing:-.02em}.muted{color:var(--muted)}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.sz{min-width:52px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:500;position:relative}
.sz.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.sz.out{color:#aaa;text-decoration:line-through}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 18px;font-weight:600;background:var(--ink);color:#fff}
.btn.wa{background:var(--wa)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.btn.full{width:100%}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin:10px 0}.check input{width:auto;margin-top:3px}
.ok{background:#eaf5ee;color:#175c34;border-radius:10px;padding:12px 14px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 18px}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}.tab.on{color:var(--ink);border-color:var(--ink)}
.inv{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.inv img{width:72px;height:96px;object-fit:cover;border-radius:8px}.inv .body{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);flex-wrap:wrap}.row:first-of-type{border-top:0}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}.qty button{border:0;background:var(--soft);width:32px;height:32px;font-size:16px}.qty span{width:38px;text-align:center;font-weight:600}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}.pill.wait{background:#fff3e8;color:var(--warn);font-weight:600}.pill.done{background:#eaf5ee;color:#175c34}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px;max-height:85vh;overflow:auto}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.preview{background:#e7f6dc;border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap;margin:10px 0}
.small{font-size:13px}.right{text-align:right}h2{font-size:18px;margin:0 0 10px}
.demo{background:#fff8e6;border:1px solid #f1e2b8;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#/" id="logo">Kemi's Closet</a><nav class="nav"><a href="#/" id="nShop">Shop</a><a href="#/admin" id="nAdmin">Owner dashboard</a></nav></div></header>
<main id="app"></main>
<div id="modal"></div>
<script>
const KEY='kc_v1';
const SEED={
 store:{name:"Kemi's Closet",whatsapp:"2348012345678",tagline:"Ankara, adire, bags and shoes. Delivery across Lagos and nationwide."},
 products:[
  {id:'ankara-wrap-dress',name:'Ankara Wrap Midi Dress',cat:'Clothing',price:28500,img:'img/ankara-wrap-dress.jpg',desc:'Wax print wrap dress with a ruffle hem. True to size.',sizes:{S:2,M:0,L:1,XL:0}},
  {id:'adire-two-piece',name:'Adire Two-Piece Set',cat:'Clothing',price:35000,img:'img/adire-two-piece.jpg',desc:'Hand-dyed indigo adire shirt and wide-leg trousers.',sizes:{M:0,L:0,XL:3}},
  {id:'tan-tote',name:'Tan Leather Tote',cat:'Bags',price:42000,img:'img/tan-tote.jpg',desc:'Structured tote with gold hardware. Fits a 13" laptop.',sizes:{'One size':0}},
  {id:'black-mini-bag',name:'Black Chain Mini Bag',cat:'Bags',price:24000,img:'img/black-mini-bag.jpg',desc:'Pebbled leather crossbody with a chain strap.',sizes:{'One size':4}},
  {id:'white-sneakers',name:'Clean White Sneakers',cat:'Shoes',price:31000,img:'img/white-sneakers.jpg',desc:'Leather low-tops for everyday wear.',sizes:{'40':1,'41':0,'42':0,'43':2,'44':0}},
  {id:'leather-slides',name:'Handmade Leather Slides',cat:'Shoes',price:18500,img:'img/leather-slides.jpg',desc:'Woven leather palm slippers, made in Lagos.',sizes:{'41':3,'42':0,'43':1,'44':2}}
 ],
 waitlist:[
  {id:1,pid:'tan-tote',size:'One size',name:'Tolu',phone:'2348031112222',status:'waiting',at:Date.now()-864e5*2},
  {id:2,pid:'tan-tote',size:'One size',name:'Chiamaka',phone:'2348052223333',status:'waiting',at:Date.now()-864e5},
  {id:3,pid:'white-sneakers',size:'42',name:'Ibrahim',phone:'2347063334444',status:'waiting',at:Date.now()-36e5*5},
  {id:4,pid:'ankara-wrap-dress',size:'M',name:'Funke',phone:'2348094445555',status:'waiting',at:Date.now()-36e5*20},
  {id:5,pid:'ankara-wrap-dress',size:'M',name:'Ada',phone:'2349015556666',status:'waiting',at:Date.now()-36e5*3},
  {id:6,pid:'adire-two-piece',size:'L',name:'Segun',phone:'2348126667777',status:'waiting',at:Date.now()-864e5*3}
 ],
 inquiries:[]
};
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch(e){return structuredClone(SEED)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=s=>document.querySelector(s);
const naira=n=>'₦'+n.toLocaleString('en-NG');
const P=id=>S.products.find(p=>p.id===id);
const total=p=>Object.values(p.sizes).reduce((a,b)=>a+b,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normPhone(v){let d=v.replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);if(d.length===10&&!d.startsWith('234'))d='234'+d;return d}
function prettyPhone(d){return d.startsWith('234')?'0'+d.slice(3):d}
const wa=(phone,text)=>`https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
const shopLink=pid=>location.href.split('#')[0]+'#/p/'+pid;
const waiting=(pid,size)=>S.waitlist.filter(w=>w.pid===pid&&(size==null||w.size===size)&&w.status==='waiting');
function badge(p){const t=total(p);if(t===0)return'<span class="badge out">Sold out</span>';if(t<=2)return`<span class="badge low">Only ${t} left</span>`;return''}
function ago(t){const h=Math.round((Date.now()-t)/36e5);return h<1?'just now':h<24?h+'h ago':Math.round(h/24)+'d ago'}

let filter='All',sel=null;
function route(){const h=location.hash||'#/';$('#nShop').className=h.startsWith('#/admin')?'':'on';$('#nAdmin').className=h.startsWith('#/admin')?'on':'';$('#logo').textContent=S.store.name;document.title=S.store.name;
 if(h.startsWith('#/p/'))return product(h.slice(4));if(h.startsWith('#/admin'))return admin();shop()}
window.addEventListener('hashchange',()=>{sel=null;route();scrollTo(0,0)});

function shop(){const cats=['All',...new Set(S.products.map(p=>p.cat))];
 const items=S.products.filter(p=>filter==='All'||p.cat===filter);
 $('#app').innerHTML=`<div class="hero"><h1>${esc(S.store.name)}</h1><p>${esc(S.store.tagline)}</p></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${c===filter?'on':''}" onclick="filter='${c}';shop()">${c}</button>`).join('')}</div>
 <div class="grid">${items.map(p=>`<a class="card" href="#/p/${p.id}"><div class="ph"><img src="${p.img}" alt="${esc(p.name)}" loading="lazy">${badge(p)}</div><div class="meta"><h3>${esc(p.name)}</h3><div class="price">${naira(p.price)}</div></div></a>`).join('')}</div>`}

function product(id){const p=P(id);if(!p)return shop();const keys=Object.keys(p.sizes);if(!sel&&keys.length===1)sel=keys[0];
 const q=sel!=null?p.sizes[sel]:null;
 let action='';
 if(sel==null)action=`<p class="muted small">Pick a size to see availability.</p>`;
 else if(q>0)action=`<p class="small">${q<=2?`<b style="color:var(--warn)">Only ${q} left</b> in ${esc(sel)}`:`In stock in ${esc(sel)}`}</p>
   <a class="btn wa full" target="_blank" onclick="logInq('${p.id}','${esc(sel)}')" href="${wa(S.store.whatsapp,`Hi ${S.store.name}, I want to buy the ${p.name} (size ${sel}) for ${naira(p.price)}. Is it still available?`)}">Order on WhatsApp</a>`;
 else action=`<div class="box" id="notify"><b>Size ${esc(sel)} is sold out</b><p class="muted small" style="margin:4px 0 0">Leave your WhatsApp number and we'll message you as soon as it's back.</p>
   <label>Your name</label><input id="nName" placeholder="e.g. Tolu">
   <label>WhatsApp number</label><input id="nPhone" inputmode="tel" placeholder="0803 123 4567">
   <div class="check"><input type="checkbox" id="nOk" checked><span>Yes, ${esc(S.store.name)} can message me on WhatsApp about this item and future offers. I can reply STOP anytime.</span></div>
   <button class="btn full" onclick="joinWait('${p.id}','${esc(sel)}')">Notify me when it's back</button></div>`;
 $('#app').innerHTML=`<a class="muted small" href="#/">← Back to shop</a>
 <div class="pd" style="margin-top:14px"><div><img src="${p.img}" alt="${esc(p.name)}"></div>
 <div><span class="muted small">${p.cat}</span><h1>${esc(p.name)}</h1><div class="price" style="font-size:20px">${naira(p.price)}</div>
 <p class="muted">${esc(p.desc)}</p><label>Size</label>
 <div class="sizes">${keys.map(k=>`<button class="sz ${k===sel?'on':''} ${p.sizes[k]===0?'out':''}" onclick="sel='${k}';product('${p.id}')">${k}</button>`).join('')}</div>
 <div style="margin-top:14px">${action}</div></div></div>`}
function logInq(pid,size){S.inquiries.push({pid,size,at:Date.now()});save()}
function joinWait(pid,size){const name=$('#nName').value.trim(),phone=normPhone($('#nPhone').value);
 if(!name||phone.length<12)return alert('Please enter your name and a valid WhatsApp number.');if(!$('#nOk').checked)return alert('Tick the box so we can message you when it is back.');
 if(!S.waitlist.some(w=>w.pid===pid&&w.size===size&&w.phone===phone&&w.status==='waiting'))S.waitlist.push({id:Date.now(),pid,size,name,phone,status:'waiting',at:Date.now()});save();
 $('#notify').innerHTML=`<div class="ok">Done, ${esc(name)}. We'll message you on WhatsApp (${prettyPhone(phone)}) when the ${esc(P(pid).name)} in ${esc(size)} is back.</div>`}

let tab='stock';
function admin(){const w=S.waitlist.filter(x=>x.status==='waiting');const sold=S.products.reduce((a,p)=>a+Object.values(p.sizes).filter(v=>v===0).length,0);
 const ready=S.products.reduce((a,p)=>a+Object.keys(p.sizes).filter(k=>p.sizes[k]>0&&waiting(p.id,k).length).length,0);
 $('#app').innerHTML=`<div class="demo">Demo mode: everything saves in this browser only. Try it: set the owner WhatsApp number in Settings, restock a sold-out size below, then send the alerts.</div>
 <h1 style="margin:0 0 4px;font-size:24px">Dashboard</h1><p class="muted" style="margin:0 0 16px">${esc(S.store.name)}</p>
 <div class="stats"><div class="stat"><b>${S.products.length}</b><span>Products</span></div><div class="stat"><b>${sold}</b><span>Sizes sold out</span></div>
 <div class="stat"><b>${w.length}</b><span>Customers waiting</span></div><div class="stat"><b style="color:${ready?'var(--wa)':'inherit'}">${ready}</b><span>Ready to alert</span></div></div>
 <div class="tabs">${[['stock','Stock'],['wait','Waitlist'],['promo','Promo'],['settings','Settings']].map(([k,l])=>`<button class="tab ${tab===k?'on':''}" onclick="tab='${k}';admin()">${l}</button>`).join('')}</div>
 <div id="tabBody"></div>`;
 ({stock,wait:waitTab,promo,settings})[tab]()}

function stock(){$('#tabBody').innerHTML=S.products.map(p=>`<div class="inv"><img src="${p.img}" alt=""><div class="body"><b>${esc(p.name)}</b> <span class="muted small">${naira(p.price)}</span>
 ${Object.keys(p.sizes).map(k=>{const q=p.sizes[k],n=waiting(p.id,k).length;return`<div class="row"><span style="width:70px" class="small">${k}</span>
 <div class="qty"><button onclick="adj('${p.id}','${k}',-1)">−</button><span>${q}</span><button onclick="adj('${p.id}','${k}',1)">+</button></div>
 ${q===0?'<span class="pill">Sold out</span>':q<=2?'<span class="pill" style="color:var(--warn)">Low</span>':''}
 ${n?(q>0?`<button class="btn wa sm" onclick="alertSheet('${p.id}','${k}')">Back in stock: alert ${n} ${n>1?'people':'person'}</button>`:`<span class="pill wait">${n} waiting</span>`):''}</div>`}).join('')}
 </div></div>`).join('')}
function adj(pid,k,d){const p=P(pid);p.sizes[k]=Math.max(0,p.sizes[k]+d);save();admin()}

function restockMsg(w){const p=P(w.pid),q=p.sizes[w.size];return`Hi ${w.name}, good news from ${S.store.name}! The ${p.name}${w.size!=='One size'?` in size ${w.size}`:''} you asked about is back in stock${q<=3?`, but only ${q} available`:''}. Price: ${naira(p.price)}.\n\nReply here to order, or see it here: ${shopLink(p.id)}`}
function alertSheet(pid,k){const list=waiting(pid,k);const p=P(pid);
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h2>Restock alert: ${esc(p.name)} (${esc(k)})</h2>
 <p class="muted small" style="margin:0">Tap Send for each customer. WhatsApp opens with the message ready, you just hit send.</p>
 <div class="preview">${esc(restockMsg(list[0]||{name:'Tolu',pid,size:k}))}</div>
 <div class="list">${list.map(w=>`<div class="item"><div><b>${esc(w.name)}</b><div class="muted small">${prettyPhone(w.phone)} · waiting ${ago(w.at)}</div></div>
 <a class="btn wa sm" target="_blank" href="${wa(w.phone,restockMsg(w))}" onclick="markSent(${w.id},this)">Send</a></div>`).join('')||'<p class="muted">Everyone has been alerted.</p>'}</div>
 <button class="btn ghost full" style="margin-top:14px" onclick="closeM()">Done</button></div></div>`}
function markSent(id,el){const w=S.waitlist.find(x=>x.id===id);w.status='notified';w.sentAt=Date.now();save();setTimeout(()=>{el.outerHTML='<span class="pill done">Sent</span>'},300)}
function closeM(){$('#modal').innerHTML='';admin()}

function waitTab(){const rows=[...S.waitlist].sort((a,b)=>b.at-a.at);
 $('#tabBody').innerHTML=`<div class="box" style="margin-top:0"><h2>Everyone who asked for a sold-out item</h2><div class="list">${rows.map(w=>{const p=P(w.pid);const back=p.sizes[w.size]>0;
 return`<div class="item"><div><b>${esc(w.name)}</b> <span class="muted small">${prettyPhone(w.phone)}</span><div class="small">${esc(p.name)} · ${esc(w.size)} · ${ago(w.at)}</div></div>
 <div class="right">${w.status==='notified'?'<span class="pill done">Alerted</span>':back?`<a class="btn wa sm" target="_blank" href="${wa(w.phone,restockMsg(w))}" onclick="markSent(${w.id},this)">Send alert</a>`:'<span class="pill wait">Waiting</span>'}</div></div>`}).join('')||'<p class="muted">No one yet.</p>'}</div></div>`}

let promoText='';
function contacts(){const m=new Map();S.waitlist.forEach(w=>{if(!m.has(w.phone))m.set(w.phone,w.name)});return[...m].map(([phone,name])=>({phone,name}))}
function promo(){const c=contacts();if(!promoText)promoText=`Hi {name}! ${S.store.name} weekend sale: 15% off all bags till Sunday. Reply "BAG" and we'll send you what's available.`;
 $('#tabBody').innerHTML=`<div class="box" style="margin-top:0"><h2>Announce a sale or promo</h2>
 <label>Message (use {name} for the customer's first name)</label><textarea id="pTxt" rows="4" oninput="promoText=this.value;prev()">${esc(promoText)}</textarea>
 <label>Feature a product (optional)</label><select id="pProd" onchange="prev()"><option value="">None</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
 <div class="preview" id="pPrev"></div>
 <button class="btn ghost sm" onclick="navigator.clipboard.writeText(build('').replace(/^Hi !?\\s*/,''));this.textContent='Copied'">Copy for WhatsApp Status or broadcast list</button></div>
 <div class="box"><h2>Send to ${c.length} opted-in customers</h2><div class="list">${c.map(x=>`<div class="item"><div><b>${esc(x.name)}</b> <span class="muted small">${prettyPhone(x.phone)}</span></div>
 <a class="btn wa sm" target="_blank" onclick="setTimeout(()=>this.outerHTML='<span class=&quot;pill done&quot;>Sent</span>',300)" href="#" onmouseover="this.href=wa('${x.phone}',build('${esc(x.name)}'))" ontouchstart="this.href=wa('${x.phone}',build('${esc(x.name)}'))" onfocus="this.href=wa('${x.phone}',build('${esc(x.name)}'))">Send</a></div>`).join('')}</div></div>`;prev()}
function build(name){const pid=$('#pProd')?.value;let t=promoText.replaceAll('{name}',name);if(pid)t+=`\n\n${P(pid).name}, ${naira(P(pid).price)}: ${shopLink(pid)}`;return t}
function prev(){$('#pPrev').textContent=build(contacts()[0]?.name||'Tolu')}

function settings(){$('#tabBody').innerHTML=`<div class="box" style="margin-top:0"><h2>Store settings</h2>
 <label>Store name</label><input id="sName" value="${esc(S.store.name)}"><label>Tagline</label><input id="sTag" value="${esc(S.store.tagline)}">
 <label>Your WhatsApp number (orders come here)</label><input id="sWa" inputmode="tel" value="${prettyPhone(S.store.whatsapp)}">
 <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" onclick="S.store.name=$('#sName').value;S.store.tagline=$('#sTag').value;S.store.whatsapp=normPhone($('#sWa').value);save();admin()">Save</button>
 <button class="btn ghost" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);S=load();admin()}">Reset demo</button></div></div>`}
route();
</script>
</body>
</html>
